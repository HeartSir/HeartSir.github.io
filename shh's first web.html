<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat AI</title>
    <style>
        /* --- 1. 微信风格样式部分 --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* 模拟手机屏幕容器 */
        .app-container {
            max-width: 600px; /* 限制最大宽度像个手机 */
            height: 100%;
            margin: 0 auto;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 顶部标题栏 */
        .header {
            background-color: #ededed;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center; /* 标题居中 */
            border-bottom: 1px solid #dcdcdc;
            flex-shrink: 0; 
            z-index: 100;
            position: relative;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        /* 聊天记录滚动区 */
        .chat-area {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f5f5f5;
        }

        /* 消息气泡通用样式 */
        .message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background-color: #ddd;
            margin-right: 10px;
            background-size: cover;
        }
        /* 气泡本体 */
        .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        /* 对方（AI）的样式 */
        .message.ai .avatar {
            background-image: url('https://cdn-icons-png.flaticon.com/512/4712/4712027.png'); /* 机器人头像 */
        }
        .message.ai .bubble {
            background-color: #ffffff;
            border: 1px solid #ededed;
        }
        .message.ai .bubble::before {
            content: "";
            position: absolute;
            left: -6px; top: 14px;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 6px solid #ffffff;
        }

        /* 我（用户）的样式 */
        .message.me {
            flex-direction: row-reverse; /* 反向排列 */
        }
        .message.me .avatar {
            margin-right: 0;
            margin-left: 10px;
            background-image: url('https://cdn-icons-png.flaticon.com/512/924/924874.png'); /* 用户头像 */
        }
        .message.me .bubble {
            background-color: #95ec69; /* 微信绿 */
            color: #000;
        }
        .message.me .bubble::before {
            content: "";
            position: absolute;
            right: -6px; top: 14px;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 6px solid #95ec69;
        }

        /* 底部输入栏 */
        .input-area {
            background-color: #f7f7f7;
            padding: 10px;
            border-top: 1px solid #dcdcdc;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .input-field {
            flex-grow: 1;
            border: none;
            border-radius: 4px;
            padding: 10px;
            font-size: 16px;
            background: white;
            outline: none;
            margin-right: 10px;
        }
        .send-btn {
            background-color: #95ec69;
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .send-btn:hover { background-color: #85da60; }
        .send-btn:disabled { background-color: #ddd; color: #999; cursor: not-allowed; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- 顶部 -->
    <div class="header">
        <h1>微信 (ChatGPT版)</h1>
    </div>

    <!-- 聊天内容区 -->
    <div class="chat-area" id="chatBox">
        <!-- 默认的一条消息 -->
        <div class="message ai">
            <div class="avatar"></div>
            <div class="bubble">你好！我是AI助手，直接发消息跟我聊天吧。</div>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <input type="text" class="input-field" id="userInput" placeholder="发消息..." onkeydown="if(event.keyCode==13) sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    /* --- 2. 逻辑脚本部分 --- */
    
    // 聊天上下文，保持对话记忆
    let messagesHistory = [
        { role: "system", content: "你是一个乐于助人的AI助手。请尽量用简短、口语化的中文回答，就像在微信聊天一样。" }
    ];

    // 辅助函数：在界面上添加消息
    function appendMessage(role, text) {
        const chatBox = document.getElementById('chatBox');
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role === 'user' ? 'me' : 'ai'}`;
        
        const avatarStr = `<div class="avatar"></div>`;
        const bubbleStr = `<div class="bubble">${text}</div>`;
        
        msgDiv.innerHTML = role === 'user' ? (bubbleStr + avatarStr) : (avatarStr + bubbleStr);
        
        chatBox.appendChild(msgDiv);
        // 滚动到底部
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 发送消息的主函数
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const text = input.value.trim();

        // ================= 配置区域 =================
        // 你的配置信息写死在这里：
        const apiKey = 'sk-CU5LyD3BviGoBIUM1b4aD3F5FfFf49BeAd2f47779fA9853d'; 
        const apiUrl = 'https://free.v36.cm/v1/chat/completions';
        const modelName = "gpt-4o-mini"; // 修正了这里的拼写错误(cosnt -> const)
        // ===========================================

        if (!text) return;

        // 1. 显示用户的消息
        appendMessage('user', text);
        input.value = '';
        
        // 2. 锁定发送按钮
        sendBtn.disabled = true;
        sendBtn.textContent = "对方正在输入...";
        
        // 更新历史记录
        messagesHistory.push({ role: "user", content: text });

        try {
            // 3. 请求 API
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    // 这里引用上面定义的 apiKey 变量，语法更安全
                    'Authorization': 'Bearer ' + apiKey 
                },
                body: JSON.stringify({
                    model: modelName, // 引用上面定义的 modelName
                    messages: messagesHistory,
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "网络请求失败，请检查接口地址");
            }

            const data = await response.json();
            // 防止接口返回格式不标准，做个兼容检查
            if (!data.choices || data.choices.length === 0) {
               throw new Error("API返回数据异常");
            }
            
            const aiReply = data.choices[0].message.content;

            // 4. 显示 AI 的回复
            appendMessage('assistant', aiReply);
            
            // 存入历史
            messagesHistory.push({ role: "assistant", content: aiReply });

        } catch (error) {
            console.error(error);
            appendMessage('assistant', `[出错啦] ${error.message}`);
        } finally {
            // 5. 恢复按钮状态
            sendBtn.disabled = false;
            sendBtn.textContent = "发送";
            // 重新聚焦输入框，方便继续打字
            input.focus(); 
        }
    }
</script>

</body>
</html>
