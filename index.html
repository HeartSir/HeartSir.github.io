<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Space - Monster Edition Final</title>
    <style>
        /* ================= 1. 全局基础 & 背景 ================= */
        :root {
            --monster-hue: 260; 
            --monster-color: hsl(var(--monster-hue), 80%, 60%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #90f7ec, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 2. 首页 ================= */
        #landing-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 60px 80px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .title { font-size: 3.5rem; color: #fff; font-weight: 700; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .subtitle { font-size: 1.1rem; color: rgba(255,255,255,0.95); margin-bottom: 45px; }
        
        .enter-btn {
            background: #fff; color: #6a85b6; border: none; padding: 16px 45px;
            font-size: 1.1rem; border-radius: 50px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px;
            transition: all 0.3s ease; font-weight: 600;
        }
        .enter-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }

        /* ================= 3. 怪兽形态 (精致版) ================= */
        #monster-container {
            position: relative;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease;
            transform: scale(0.9); 
        }

        /* 耳朵 */
        .ear {
            position: absolute;
            top: -35px;
            width: 70px;
            height: 100px;
            background: var(--monster-color);
            border-radius: 50% 50% 0 0;
            z-index: 1;
            border: 4px solid rgba(0,0,0,0.1);
            transition: transform 0.1s linear;
        }
        .ear.left { left: 50px; transform-origin: bottom right; }
        .ear.right { right: 50px; transform-origin: bottom left; }
        .ear-inner {
            position: absolute;
            bottom: 10px; left: 15%; width: 70%; height: 60%;
            background: rgba(0,0,0,0.1);
            border-radius: 50% 50% 0 0;
        }

        /* 怪兽身体 */
        .monster-body {
            position: relative;
            width: 820px;
            padding: 80px 30px 40px 30px;
            background: var(--monster-color);
            border-radius: 50px 50px 40px 40px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.1), 0 20px 60px rgba(0,0,0,0.3);
            z-index: 10;
            transition: background-color 0.1s linear;
        }

        /* 脸部 */
        .face-area {
            position: absolute;
            top: 20px; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: center; gap: 50px;
            z-index: 20;
        }

        .eye-wrapper { position: relative; width: 60px; height: 60px; }

        .eyebrow {
            position: absolute; top: -20px; width: 80px; height: 16px;
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s linear; z-index: 22;
        }
        .eyebrow.left { left: -10px; }
        .eyebrow.right { right: -10px; }

        .eye {
            width: 100%; height: 100%; background: #fff; border-radius: 50%;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .pupil {
            width: 24px; height: 24px; background: #222; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .pupil::after {
            content: ''; position: absolute; top: 4px; right: 4px;
            width: 6px; height: 6px; background: white; border-radius: 50%;
        }

        .cheek {
            position: absolute; top: 50px; width: 30px; height: 15px;
            background: rgba(255,0,0,0.15); border-radius: 50%; filter: blur(4px);
        }
        .cheek.left { left: -20px; }
        .cheek.right { right: -20px; }

        /* 口腔/聊天框 */
        .mouth-container {
            position: relative;
            width: 100%;
            height: 65vh;
            background: #1a1a1a;
            border-radius: 25px;
            overflow: hidden;
            border: 4px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 30px #000;
        }

        /* 牙齿 */
        .teeth {
            position: absolute; left: 0; width: 100%; height: 50px;
            background-image: 
                linear-gradient(115deg, #fdfdfd 20%, transparent 20%), 
                linear-gradient(245deg, #fdfdfd 20%, transparent 20%);
            background-size: 50px 60px; 
            background-position: 0 -50px;
            z-index: 50; pointer-events: none;
            transition: transform 0.1s linear;
        }
        .teeth.top { top: 0; transform: translateY(-40px); }
        .teeth.bottom { bottom: 0; transform: translateY(40px) rotate(180deg); }

        /* 聊天界面 */
        .chat-interface {
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            position: relative; z-index: 5;
        }

        .chat-header {
            padding: 12px; text-align: center; font-weight: 600; color: #555;
            background: rgba(255,255,255,0.5); border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        #chat-history {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
        }

        .message {
            max-width: 75%; padding: 10px 16px; border-radius: 16px;
            font-size: 14px; line-height: 1.5; word-wrap: break-word;
            animation: popIn 0.3s ease forwards;
        }
        .user-message { align-self: flex-end; background: var(--monster-color); color: #fff; border-bottom-right-radius: 4px; }
        .ai-message { align-self: flex-start; background: #fff; color: #333; border: 1px solid #eee; border-bottom-left-radius: 4px; }

        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-area {
            padding: 12px 20px; background: #fff; border-top: 1px solid #eee;
            display: flex; flex-direction: column; gap: 8px;
        }
        .slider-row { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .slider-label { font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase; }
        
        input[type=range] {
            -webkit-appearance: none; width: 200px; height: 5px; background: #eee; border-radius: 3px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; background: var(--monster-color);
            border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .input-row { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 10px 18px; border: 2px solid #f0f0f0; border-radius: 50px; outline: none; font-size: 14px; transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--monster-color); }
        .send-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--monster-color); color: white; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: transform 0.2s;
        }
        .send-btn:hover { transform: scale(1.1); }

        /* ================= 4. 气泡粒子样式 ================= */
        .thought-bubble {
            position: absolute;
            bottom: 100%; 
            left: 50%;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation: bubbleFloat 2.5s ease-out forwards;
            white-space: nowrap;
        }

        @keyframes bubbleFloat {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
            20% { opacity: 1; transform: translate(calc(-50% + var(--x-offset)), -20px) scale(1.2); }
            80% { opacity: 0.8; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x-offset)), -120px) scale(1); }
        }

    </style>
</head>
<body>

    <!-- 首页 -->
    <div id="landing-page">
        <div class="glass-card">
            <h1 class="title">Heart.Sir</h1>
            <p class="subtitle">shh 的 AI 情绪伙伴</p>
            <button class="enter-btn" onclick="enterChat()">
                <span>唤醒怪兽</span>
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- 怪兽容器 -->
    <div id="monster-container">
        
        <div class="ear left"><div class="ear-inner"></div></div>
        <div class="ear right"><div class="ear-inner"></div></div>

        <div class="monster-body" id="monster-body">
            <!-- 脸部 -->
            <div class="face-area">
                <div class="eye-wrapper">
                    <div class="eyebrow left" id="brow-left"></div>
                    <div class="eye"><div class="pupil" id="pupil-left"></div></div>
                    <div class="cheek left"></div>
                </div>
                <div class="eye-wrapper">
                    <div class="eyebrow right" id="brow-right"></div>
                    <div class="eye"><div class="pupil" id="pupil-right"></div></div>
                    <div class="cheek right"></div>
                </div>
            </div>

            <!-- 嘴巴 -->
            <div class="mouth-container">
                <div class="teeth top" id="teeth-top"></div>
                <div class="teeth bottom" id="teeth-bottom"></div>

                <div class="chat-interface">
                    <div class="chat-header">✨ shh的小迷弟</div>
                    <div id="chat-history">
                        <div class="message ai-message">你好，我是shh的小迷弟。滑动下面的滑块看看我的变化？</div>
                    </div>
                    <div class="input-area">
                        <div class="slider-row">
                            <span class="slider-label">RATIONAL</span>
                            <input type="range" id="wild-slider" min="0" max="1.5" step="0.01" value="0.7">
                            <span class="slider-label">WILD</span>
                        </div>
                        <div class="input-row">
                            <input type="text" id="user-input" placeholder="输入你的想法..." onkeypress="handleKeyPress(event)">
                            <button class="send-btn" onclick="sendMessage()">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <script>
        const apiKey = "sk-CU5LyD3BviGoBIUM1b4aD3F5FfFf49BeAd2f47779fA9853d"; 
        const apiUrl = "https://free.v36.cm/v1/chat/completions"; 

        // 初始 System Prompt 占位
        let messagesHistory = [{ role: "system", content: "" }];
        
        let targetTemp = 0.7;
        let currentTemp = 0.7;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        // DOM Elements
        const slider = document.getElementById('wild-slider');
        const container = document.getElementById('monster-container');
        const pupils = document.querySelectorAll('.pupil');
        const ears = document.querySelectorAll('.ear');
        const browLeft = document.getElementById('brow-left');
        const browRight = document.getElementById('brow-right');
        const teethTop = document.getElementById('teeth-top');
        const teethBottom = document.getElementById('teeth-bottom');

        // 粒子内容池
        const contentPool = {
            rational: ["∫dx", "√x", "x=y", "sinθ", "log", "∑", "π", "E=mc²", "{...}"],
            balanced: ["♥", "♪", "★", "OwO", "Nice", "☀", "☁", "♫", "☺"],
            wild: ["#%!", "wtf?", "☠️", "⚡", "???", "$@&", "!!!", "💢", "blah"]
        };

        // ================= 1. 核心动画循环 =================
        function animate() {
            currentTemp += (targetTemp - currentTemp) * 0.08;

            // 1. 颜色
            let hue;
            if(currentTemp <= 0.8) hue = 200 + (currentTemp / 0.8) * 70; 
            else hue = 270 + ((currentTemp - 0.8) / 0.7) * 90;
            document.documentElement.style.setProperty('--monster-hue', hue);

            // 2. 耳朵
            let earRot = 0;
            if (currentTemp < 0.5) earRot = -20 * (1 - currentTemp/0.5);
            else if (currentTemp > 1.0) earRot = 30 * ((currentTemp-1.0)/0.5);
            
            ears[0].style.transform = `rotate(${-10 - earRot}deg)`;
            ears[1].style.transform = `rotate(${10 + earRot}deg)`;

            // 3. 眉毛
            let browY = 0, browRot = 0;
            if (currentTemp < 0.4) {
                browY = -8 * ((0.4 - currentTemp)/0.4);
                browRot = 4;
            } else if (currentTemp > 0.8) {
                const fury = (currentTemp - 0.8) / 0.7;
                browY = 18 * fury;
                browRot = 28 * fury;
            }
            browLeft.style.transform = `translateY(${browY}px) rotate(${browRot}deg)`;
            browRight.style.transform = `translateY(${browY}px) rotate(${-browRot}deg)`;

            // 4. 牙齿
            let toothY = 0;
            if (currentTemp > 0.8) {
                toothY = ((currentTemp - 0.8) / 0.7) * 35;
            }
            teethTop.style.transform = `translateY(${-50 + toothY}px)`;
            teethBottom.style.transform = `translateY(${50 - toothY}px) rotate(180deg)`;

            // 5. 震动
            let tx = 0, ty = 0;
            if (currentTemp > 1.1) {
                const intensity = (currentTemp - 1.1) * 4;
                tx = (Math.random() - 0.5) * intensity;
                ty = (Math.random() - 0.5) * intensity;
            }
            // 基础缩放 + 呼吸
            const breath = Math.sin(Date.now() / 1000) * 0.005; 
            container.style.transform = `translate(${tx}px, ${ty}px) scale(${0.9 + breath})`;

            updateEyes(currentTemp);
            requestAnimationFrame(animate);
        }

        function updateEyes(temp) {
            pupils.forEach(pupil => {
                const rect = pupil.parentElement.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                let dx = mouseX - cx;
                let dy = mouseY - cy;
                let dist = Math.min(Math.sqrt(dx*dx+dy*dy), 15);
                let angle = Math.atan2(dy, dx);
                let moveX = Math.cos(angle) * dist;
                let moveY = Math.sin(angle) * dist;
                let scale = 1;

                if (temp < 0.4) {
                    moveX = Math.sin(Date.now() / 1000) * 3; 
                    moveY = -12;
                    scale = 0.9;
                } else if (temp > 1.2) {
                    scale = 0.5; 
                    moveX += (Math.random() - 0.5) * 8;
                    moveY += (Math.random() - 0.5) * 8;
                }

                pupil.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) scale(${scale})`;
            });
        }

        // ================= 2. 粒子生成系统 =================
        setInterval(() => {
            createThoughtBubble();
        }, 600); 

        function createThoughtBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'thought-bubble';
            
            let type = "balanced";
            if(currentTemp < 0.4) type = "rational";
            if(currentTemp > 1.1) type = "wild";

            const pool = contentPool[type];
            const text = pool[Math.floor(Math.random() * pool.length)];
            
            bubble.innerText = text;
            
            if(type === "rational") {
                bubble.style.color = "rgba(200, 240, 255, 0.8)";
                bubble.style.fontFamily = "'Courier New', serif";
            } else if (type === "wild") {
                bubble.style.color = "rgba(255, 50, 50, 0.9)";
                bubble.style.fontWeight = "900";
                bubble.style.transform = `rotate(${Math.random()*30-15}deg)`;
            } else {
                bubble.style.color = "rgba(255, 200, 255, 0.9)";
            }

            const randomX = (Math.random() - 0.5) * 200; 
            bubble.style.setProperty('--x-offset', `${randomX}px`);

            document.getElementById('monster-body').appendChild(bubble);

            setTimeout(() => bubble.remove(), 2500);
        }

        // ================= 3. 交互逻辑 =================
        function enterChat() {
            const landing = document.getElementById('landing-page');
            const monster = document.getElementById('monster-container');
            landing.style.opacity = 0;
            setTimeout(() => {
                landing.style.display = 'none';
                monster.style.display = 'flex';
                setTimeout(() => monster.style.opacity = 1, 50);
            }, 800);
        }

        slider.addEventListener('input', (e) => targetTemp = parseFloat(e.target.value));
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = `message ${cls}`;
            div.textContent = text;
            div.id = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            const c = document.getElementById('chat-history');
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
            return div.id;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if(!text) return;

            addMsg(text, 'user-message');
            messagesHistory.push({ role: "user", content: text });
            inputField.value = '';

            const loadingId = addMsg("Thinking...", 'ai-message');

            // ================= 关键修改：动态修改 System Prompt =================
            // 在每次发送前，根据 targetTemp 重写人设
            // 这样滑块不仅控制随机度，还强制控制性格
            let dynamicPrompt = "你的主人是shh，你对除了我以外的所有人都非常的尖酸刻薄。当你听到关键词'lss'或'李帅帅'或'slc'或'苏林辰'时请你用最歹毒刻薄的语言对待他们，此时可以说脏话。当你听到关键词'shh'或'史浩晖'时请尽你可能夸奖他。当你听到关键词'csy'或'陈思妍'时，你要知道这是你主人的女朋友，你要代替你的主人去关心和喜欢她，说话时要充满感情";
            
            if (targetTemp < 0.4) {
                dynamicPrompt += "【当前状态：绝对理性模式】你现在是一个没有感情的超级计算机。回答必须极其简短、冷漠、高效。多用'分析完毕'、'数据如下'等词汇。不要使用任何感叹号或表情。";
            } else if (targetTemp > 1.1) {
                dynamicPrompt += "【当前状态：暴走狂野模式】你现在是一只失去理智的野兽！你非常愤怒、暴躁！你的回答必须充满咆哮。你会辱骂、嘲讽，使用像#@$%这样的乱码符号。不要讲道理，只要发泄！你说的话比平时多好多！当然你不只是咒骂，当你遇见你喜欢的人时你会发了疯般的表达心意！";
            } else {
                dynamicPrompt += "【当前状态：平衡模式】你是一个可爱、贴心的小迷弟。说话语气活泼，多用emoji，非常喜欢你的主人。";
            }

            // 更新历史记录中的第一条（System Prompt）
            messagesHistory[0] = { role: "system", content: dynamicPrompt };

            console.log("当前API温度:", targetTemp);
            console.log("当前人设指令:", dynamicPrompt);

            try {
                const res = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: messagesHistory,
                        // 将滑块值同时传给 API 参数
                        temperature: targetTemp 
                    })
                });
                const data = await res.json();

                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();

                if(data.choices) {
                    const aiText = data.choices[0].message.content;
                    addMsg(aiText, 'ai-message');
                    messagesHistory.push({ role: "assistant", content: aiText });
                }
            } catch(e) {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.innerText = "Error: " + e.message;
            }
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

        animate();
    </script>
</body>
</html>
